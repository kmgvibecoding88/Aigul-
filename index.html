<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АНПЗ Сервис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2F80ED;--blue-btn:#1E6FD9;--orange:#FF9F1C;--green:#27AE60;--yellow:#F2C94C;--red:#EB5757;--red-btn:#D64545;
  --bg:#FFF8EE;--card:#FFFFFF;--soft:#FBEFDC;--ink:#1E2A44;--muted:#5B6782;--line:#1E2A44;--shadow:#1E2A44;--row:#F1E7D6;--chip:#E8F1FD;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121A2C;--card:#1C2740;--soft:#243252;--ink:#F4EFE6;--muted:#A8B3CB;--line:#5E70A0;--shadow:#060A14;--row:#2A3960;--chip:#22355E;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A2C;--card:#1C2740;--soft:#243252;--ink:#F4EFE6;--muted:#A8B3CB;--line:#5E70A0;--shadow:#060A14;--row:#2A3960;--chip:#22355E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
h1,h2,h3,h4{font-weight:900;margin:0 0 .5em;line-height:1.2}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
a{color:var(--blue)}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* sticker cards & buttons */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--shadow);padding:18px}
.card.flat{box-shadow:none}
.btn{font:inherit;font-weight:800;font-size:14px;border:2.5px solid var(--line);border-radius:16px;padding:8px 15px;background:var(--card);color:var(--ink);
  box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow);transition-duration:.08s}
.btn.primary{background:var(--blue-btn);color:#fff}
.btn.accent{background:var(--orange);color:#1E2A44}
.btn.ok{background:var(--green);color:#1E2A44}
.btn.danger{background:var(--red-btn);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:12px;box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.big{font-size:17px;padding:12px 22px;border-radius:20px}

input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--blue)}
.fld{margin-bottom:14px}
.fld label,.fld .lbl{display:block;font-weight:800;margin-bottom:5px}
.fld .err{color:var(--red);font-weight:700;font-size:13px;min-height:0}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.req{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.chk{display:flex!important;align-items:center;gap:8px;font-weight:700!important;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack>*+*{margin-top:16px}
.sp{flex:1}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2.5px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:900;font-size:19px;letter-spacing:-.3px}
.logo b{color:var(--orange);margin-left:4px}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{padding:6px 11px;border-radius:12px;font-weight:800;color:var(--ink);text-decoration:none;border:2px solid transparent;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--orange);border-color:var(--line);color:#1E2A44}
.cnt{background:var(--red-btn);color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.tools{display:flex;gap:6px;align-items:center}
.pop{position:relative}
.drop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,92vw);z-index:40;padding:12px;max-height:70vh;overflow:auto}
.ava{width:26px;height:26px;border-radius:50%;background:var(--blue-btn);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:900;border:2px solid var(--line)}
.nitem{display:block;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink);border:2px solid transparent}
.nitem:hover{background:var(--soft)}
.nitem.unread{background:var(--chip);border-color:var(--line)}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line);color:var(--ink)}
.demo-bar{background:var(--orange);color:#1E2A44;text-align:center;font-weight:800;font-size:13px;padding:4px 10px}

main{max-width:1200px;margin:0 auto;padding:24px 20px 70px}
.crumbs{font-size:13px;margin-bottom:10px;color:var(--muted)}
.crumbs a{color:var(--muted)}

/* badges */
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:12px;border:2px solid var(--line);color:#1E2A44;white-space:nowrap}
.sla{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
.sla i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.sla.g i{background:var(--green)}.sla.y i{background:var(--yellow)}.sla.r i{background:var(--red)}.sla.p i{background:#B9A6F0}.sla.n i{background:transparent}
.sla.r{color:var(--red)}

/* hero & tiles */
.hero{display:flex;gap:22px;align-items:center;background:linear-gradient(135deg,var(--chip),var(--card))}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{display:block;text-decoration:none;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.tile:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:6px 8px 0 var(--shadow)}
.tile h3{margin:10px 0 4px}
.tile .ico{width:62px;height:62px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.titem{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);transition:transform .15s}
.titem:hover{transform:translateY(-3px);background:var(--chip)}
.titem b{font-size:15px}

/* tables */
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--soft);font-weight:900}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1.5px solid var(--row);text-align:left;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--chip)}
.tbl a{font-weight:800;text-decoration:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.filters>*{flex:1 1 150px;max-width:240px}
.filters label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:3px}
.seg{display:inline-flex;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:2px 2px 0 var(--shadow)}
.seg button{font:inherit;font-weight:800;font-size:13px;border:0;background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--orange);color:#1E2A44}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:260px;transition:background .15s}
.col.over{background:var(--chip);border-style:solid}
.col h3{font-size:14px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:2px 2px 0 var(--shadow);cursor:grab;font-size:13px}
.kcard:active{cursor:grabbing}
.kcard a{font-weight:900;text-decoration:none;color:var(--ink)}
.kcard.over{border-color:var(--red);border-width:3px}

/* request card */
.dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:14px}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{margin:0;font-weight:700;word-break:break-word}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
.step{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);opacity:.45}
.step.done{opacity:1;background:var(--chip)}
.step.cur{opacity:1;background:var(--orange);color:#1E2A44}
.step.bad{opacity:1;background:#F9CACA;color:#1E2A44}
.arrow{color:var(--muted);font-weight:900}
.hist{list-style:none;padding:0;margin:0;font-size:13px}
.hist li{position:relative;padding:0 0 12px 22px;border-left:2.5px solid var(--row);margin-left:6px}
.hist li:last-child{border-left-color:transparent}
.hist li::before{content:"";position:absolute;left:-8px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:85%;padding:9px 12px;border:2px solid var(--line);border-radius:16px 16px 16px 4px;background:var(--card);font-size:14px}
.msg.mine{align-self:flex-end;background:var(--chip);border-radius:16px 16px 4px 16px}
.msg.int{background:#FFF1CC;color:#1E2A44;border-style:dashed}
.msg .who{font-size:12px;font-weight:900;margin-bottom:2px;display:flex;gap:6px;justify-content:space-between}
.file{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;padding:3px 9px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);margin:3px 4px 0 0}
.stars{display:inline-flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:32px;cursor:pointer;color:var(--row);transition:transform .15s;-webkit-text-stroke:1.5px var(--line);line-height:1}
.stars label:hover,.stars label:hover~label,.stars input:checked~label{color:var(--orange)}
.stars label:hover{transform:scale(1.2)}
.stars input:focus-visible+label{outline:3px solid var(--blue)}
.rate-show{color:var(--orange);font-size:18px;letter-spacing:2px}

/* stats */
.stat{padding:16px}
.stat .v{font-size:32px;font-weight:900;line-height:1.1}
.stat .l{color:var(--muted);font-weight:800;font-size:13px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(110px,32%) 1fr 48px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bar-track{height:20px;background:var(--soft);border-radius:8px;border:2px solid var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-right:2px solid var(--line)}
.bar-fill.o{background:var(--orange)}.bar-fill.g{background:var(--green)}

/* vacations */
.vac td,.vac th{padding:0;text-align:center;font-size:11px;min-width:24px;height:30px;border-bottom:1.5px solid var(--row)}
.vac th.name,.vac td.name{text-align:left;padding:0 10px;min-width:170px;font-size:13px;position:sticky;left:0;background:var(--card);z-index:1}
.vac .we{background:var(--soft)}
.vac .hol{background:#FFE3B3;color:#1E2A44}
.vac .v1{background:var(--blue)}
.vac .v2{background:repeating-linear-gradient(45deg,var(--blue) 0 4px,transparent 4px 8px)}
.vac th.clash{background:var(--red);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;margin-top:10px}
.legend i{display:inline-block;width:16px;height:12px;border:1.5px solid var(--line);border-radius:3px;vertical-align:-2px;margin-right:4px}

/* empty & mascot */
.empty{text-align:center;padding:28px 10px}
.empty p{font-weight:800;font-size:16px}
.mascot{transform-origin:50% 95%;animation:sway 3.2s ease-in-out infinite;flex:none}
.mascot.still{animation:none}
.wave{transform-origin:100px 96px;animation:wave 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

/* modal, toast, confetti */
.modal-bg{position:fixed;inset:0;background:rgba(18,26,44,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{width:min(480px,100%);animation:pop .25s ease-out}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);padding:10px 14px;font-weight:800;animation:pop .2s ease-out;font-size:14px}
.toast.err{background:#F9CACA;color:#1E2A44}
.toast.ok{background:#C9F0D8;color:#1E2A44}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:150;pointer-events:none;border:1.5px solid #1E2A44;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* login */
.login{max-width:880px;margin:5vh auto;padding:0 16px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ubtn{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .15s}
.ubtn:hover{transform:translateY(-3px);background:var(--chip)}
.ubtn .ava{width:38px;height:38px;font-size:13px;flex:none}

.news{border-left:5px solid var(--orange);padding:6px 0 6px 12px;margin-bottom:12px}
.fbuild{display:grid;grid-template-columns:1.4fr 1fr 1.4fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-title h1,.sec-title h2{margin:0}
.hide-m{display:inline}

@media (max-width:900px){
  .grid2,.grid3{grid-template-columns:1fr}
  .nav{order:3;width:100%;flex:none}
  .top{padding:8px 16px;gap:8px}
  .logo{flex:1}
  main{padding:16px 16px 60px}
  .hero{flex-direction:column;text-align:center}
  h1{font-size:23px}
  .fbuild{grid-template-columns:1fr 1fr}
  .hide-m{display:none}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}
@media (max-width:480px){
  .row2{grid-template-columns:1fr}
  .filters>*{max-width:none}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:12px}
  .tile .ico{width:46px;height:46px}
  .tile p{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   АНПЗ Сервис — интерактивный прототип по PRD_4.md
   Все данные хранятся в localStorage браузера. Слой A.* моделирует
   серверное API: каждое действие проверяет права (RBAC) и пишет аудит.
   ===================================================================== */
const LS = 'anpz-servis-demo-v1', H = 36e5, D = 864e5, Q = 9e5;
const FORBID = new Error('403');
const SESSION_TTL = 8 * H;
const app = document.getElementById('app');
let db, post = [], ui = { open: null, my: {}, q: {}, aud: {}, vm: 0, b: null, an: 'all' };

/* ---------- storage ---------- */
function load() { try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) { } }

/* ---------- utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const z2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const fdt = ts => ts ? new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('ru-RU') : '—';
const ago = ts => { const m = Math.round((Date.now() - ts) / 6e4); if (m < 1) return t('justnow'); if (m < 60) return m + ' ' + t('minago'); const h = Math.round(m / 60); if (h < 24) return h + ' ' + t('hago'); return Math.round(h / 24) + ' ' + t('dago'); };
const need = c => { if (!c) throw FORBID; };
const has = (u, r) => !!u && u.roles.includes(r);
const user = id => db.users.find(x => x.id === id) || { id, fio: id === 'system' ? 'Система' : '—', roles: [] };
const me = () => db.session.uid ? db.users.find(x => x.id === db.session.uid && x.active) : null;
const req = id => db.reqs.find(x => x.id === id);
const typeById = id => db.types.find(x => x.id === id);
const catById = id => db.cats.find(x => x.id === id);
const typeOf = r => typeById(r.type);
const deptOf = r => typeOf(r)?.cat;
const initials = f => f.split(' ').slice(0, 2).map(s => s[0]).join('');
const shortName = f => { const p = f.split(' '); return p.length > 1 ? p[0] + ' ' + p[1][0] + '.' : f; };
const uniq = a => [...new Set(a.filter(Boolean))];
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(b / 1024)) + ' КБ';
const numFmt = n => 'АНПЗ-' + new Date().getFullYear() + '-' + String(n).padStart(6, '0');
const catName = c => c ? (db.ui.lang === 'kz' && c.kz ? c.kz : c.ru) : '—';

/* ---------- i18n (RU / KZ) ---------- */
const I18N = {
  ru: {
    home: 'Главная', catalog: 'Каталог услуг', my: 'Мои заявки', approvals: 'На согласовании', vacations: 'График отпусков',
    queue: 'Очередь заявок', dash: 'Мой дашборд', users: 'Пользователи', builder: 'Конструктор', dicts: 'Справочники',
    analytics: 'Аналитика', audit: 'Аудит', settings: 'Настройки', profile: 'Профиль', create: 'Создать заявку', logout: 'Выйти',
    hello: 'Привет', helpq: 'Чем помочь сегодня?', active: 'Мои активные заявки', news: 'Новости и объявления', search: 'Поиск',
    st_draft: 'Черновик', st_new: 'Новая', st_approval: 'На согласовании', st_rejected: 'Отклонена', st_work: 'В работе',

    if (a && b && a <= b) { const n = vacDays(a, b), hs = holidaysIn(a, b); el.innerHTML = `<b>${n} ${n % 10 === 1 && n % 100 !== 11 ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'дня' : 'дней'}</b> (считается автоматически)${hs.length ? ` · праздники не учитываются: ${hs.map(h => fDate(h.d) + ' ' + esc(h.n)).join(', ')}` : ''}`; }
    else el.textContent = a && b ? '' : 'Выберите даты «с» и «по»';
  });
  let tm; f.addEventListener('input', () => { upd(); clearTimeout(tm); tm = setTimeout(() => A.saveDraft(false), 900); });
  f.addEventListener('change', upd); upd();
}
function collect(f, ty, strict) {
  const data = {}, errs = {}, el = f.elements;
  ty.fields.forEach(x => {
    const id = 'f_' + x.k;
    if (x.t === 'period') { const a = el[id + '_from'].value, b = el[id + '_to'].value; data[x.k] = a || b ? { from: a, to: b, days: vacDays(a, b) } : null; if (x.req && (!a || !b)) errs[id] = 'Укажите обе даты'; else if (a && b && a > b) errs[id] = 'Дата «по» раньше даты «с»'; }
    else if (x.t === 'checkbox') data[x.k] = el[id].checked;
    else if (x.t === 'file') { const fl = el[id].files[0]; const prev = ui.form.draft ? req(ui.form.draft)?.data?.[x.k] : ''; data[x.k] = fl ? fl.name : prev || ''; if (fl && (fl.size > db.settings.maxMb * 1048576 || !/\.(jpe?g|png|pdf)$/i.test(fl.name))) errs[id] = 'Только JPG, PNG, PDF до ' + db.settings.maxMb + ' МБ'; }
    else { const v = el[id].value.trim(); data[x.k] = v; if (x.req && !v) errs[id] = 'Обязательное поле'; else if (x.t === 'number' && v && (+v < 1 || !Number.isFinite(+v))) errs[id] = 'Введите число не меньше 1'; }
  });
  const subject = el.f__subject.value.trim(), desc = el.f__desc.value.trim(), priority = el.f__prio.value;
  if (!subject) errs.f__subject = 'Укажите тему';
  if (ty.descReq && !desc) errs.f__desc = 'Опишите проблему';
  const files = [...el.f__files.files].map(x => ({ name: x.name, size: x.size }));
  if (files.length > db.settings.maxFiles) errs.f__files = 'Не больше ' + db.settings.maxFiles + ' файлов';
  else if (files.some(x => x.size > db.settings.maxMb * 1048576)) errs.f__files = 'Файл больше ' + db.settings.maxMb + ' МБ';
  else if (files.some(x => !/\.(pdf|docx|xlsx|jpe?g|png)$/i.test(x.name))) errs.f__files = 'Недопустимый тип файла';
  if (strict) {
    f.querySelectorAll('.fld').forEach(x => { x.classList.remove('bad'); const e = x.querySelector('.err'); if (e) e.textContent = ''; });
    Object.entries(errs).forEach(([id, m]) => { const inp = el[id] || el[id + '_from']; const fl = inp && (inp.closest ? inp.closest('.fld') : null); if (fl) { fl.classList.add('bad'); fl.querySelector('.err').textContent = m; } });
  }
  return { data, subject, desc, priority, files, errs };
}

function analyticsData() {
  const since = ui.an === '30' ? Date.now() - 30 * D : ui.an === '7' ? Date.now() - 7 * D : 0;
  const list = db.reqs.filter(r => r.status !== 'draft' && r.created >= since);
  const fin = list.filter(r => r.doneAt);
  const onTime = fin.filter(r => r.doneAt <= r.deadline).length;
  const avgH = fin.length ? fin.reduce((s, r) => s + workHoursBetween(r.created, r.doneAt), 0) / fin.length : 0;
  const rated = list.filter(r => r.rating);
  const csat = rated.length ? rated.reduce((s, r) => s + r.rating, 0) / rated.length : 0;
  const by = (fn) => { const m = {}; list.forEach(r => { const k = fn(r); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  return { list, fin, onTime, avgH, rated, csat, byCat: by(r => catById(deptOf(r))?.ru), byDept: by(r => user(r.author).dept), byStatus: by(r => I18N.ru['st_' + r.status]), byAssignee: by(r => r.assignee && ['work', 'waiting'].includes(r.status) ? user(r.assignee).fio : null), byType: by(r => typeOf(r)?.name) };
}

function viewAnalytics(u) {

/* ---------- actions (моделируют серверное API с проверкой прав) ---------- */
function act(fn) { try { fn(); save(); render(); } catch (e) { if (e === FORBID) { toast('403: нет прав на это действие', 'err'); } else { console.error(e); toast('Ошибка: ' + e.message, 'err'); } } }
const A = {
  login(id) { db.session = { uid: id, last: Date.now() }; ui.open = null; const u = user(id); db.audit.unshift({ id: uid(), user: id, ent: 'Session', eid: '', action: 'Вход (AD/SSO)', old: '', new: u.login, ip: '10.20.1.' + (10 + db.users.indexOf(u)), t: Date.now() }); save(); location.hash = '#/home'; render(); },
  logout() { audit('Выход', '', '', '', 'Session'); db.session.uid = null; ui.open = null; save(); location.hash = ''; render(); },
  reset() { if (confirm('Сбросить все демо-данные к исходному состоянию?')) { try { localStorage.removeItem(LS); } catch (e) { } ui = { open: null, my: {}, q: {}, aud: {}, vm: 0, b: null, an: 'all' }; seed(); save(); location.hash = ''; render(); } },
  lang() { db.ui.lang = db.ui.lang === 'ru' ? 'kz' : 'ru'; render(); },

  readAll() { const u = me(); db.notifs.forEach(n => { if (n.user === u.id) n.read = true; }); render(); },

  saveDraft(manual) {

      r = { id: 'r' + db.seq, num: numFmt(db.seq++), type: ty.id, author: u.id, assignee: null, status: 'draft', priority: 'normal', subject: '', desc: '', data: {}, files: [], created: Date.now(), updated: Date.now(), deadline: 0, doneAt: null, closedAt: null, pausedAt: null, rating: null, review: '', hist: [], comments: [], approvals: [], flags: { n80: false, over: false } };
      db.reqs.push(r); ui.form.draft = r.id; audit('Создание черновика', r.id, '', 'Черновик');

    save();
    const st = document.getElementById('draftst'); if (st) st.textContent = 'Черновик ' + r.num + ' · сохранён в ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  },
  delDraft(id) { act(() => { const r = req(id); need(r && r.author === me().id && r.status === 'draft'); db.reqs = db.reqs.filter(x => x !== r); audit('Удаление черновика', id, 'Черновик', ''); toast('Черновик удалён'); location.hash = '#/my'; }); },
  submit(e) {
    e.preventDefault();
    const f = e.target, u = me(), ty = typeById(ui.form.type), c = collect(f, ty, true);
    if (Object.keys(c.errs).length) { toast('Проверьте выделенные поля', 'err'); const first = f.querySelector('.fld.bad input,.fld.bad select,.fld.bad textarea'); first && first.focus(); return false; }
    let r = ui.form.draft && req(ui.form.draft);
    if (!r) { r = { id: 'r' + db.seq, num: numFmt(db.seq++), type: ty.id, author: u.id, assignee: null, hist: [], comments: [], approvals: [], flags: { n80: false, over: false }, doneAt: null, closedAt: null, pausedAt: null, rating: null, review: '' }; db.reqs.push(r); }
    const now = Date.now(), head = u.manager && user(u.manager).active ? u.manager : null;
    const st = ty.approval && head ? 'approval' : 'new';
    Object.assign(r, { subject: c.subject, desc: c.desc, priority: c.priority, data: c.data, files: c.files, status: st, created: now, updated: now, deadline: addWork(now, ty.sla) });
    r.hist.push({ t: now, user: u.id, from: null, to: st, note: ty.approval && !head ? 'Руководитель в AD не найден — согласование пропущено' : '' });
    audit('Отправка заявки', r.id, 'Черновик', I18N.ru['st_' + st]);

    else notify(managersOf(ty.cat), fillTpl('created', r), r.id);
    db.notifs.unshift({ id: uid(), user: u.id, text: fillTpl('created', r), rid: r.id, t: now, read: false, ch: ['portal', 'email'] });
    ui.form = null; save();

    const m = modal(`<div style="text-align:center">${mascot('happy', 120)}<h2>Заявка отправлена!</h2><p><b>${r.num}</b><br>${st === 'approval' ? 'Ушла на согласование руководителю: ' + esc(user(head).fio) : 'Попала в очередь отдела ' + deptName(ty.cat)}.<br>Срок по SLA: ${fdt(r.deadline)}</p><div class="row" style="justify-content:center"><button class="btn primary" data-ok>Открыть заявку</button><button class="btn" data-x>На главную</button></div></div>`);
    m.querySelector('[data-ok]').onclick = () => { m.remove(); go('#/r/' + r.id); };
    m.querySelector('[data-x]').onclick = () => { m.remove(); go('#/home'); };

  approve(id, silent) {

  async reject(id) {
    const v = await ask({ title: 'Отклонить заявку', text: 'Автор увидит причину в карточке и в уведомлении.', label: 'Причина отклонения', req: true, ok: 'Отклонить', cls: 'danger', em: 'sad' });
    if (v == null) return;
    act(() => { const u = me(), r = req(id); const asHead = isHeadOf(u, r) && r.status === 'approval'; need(r && (asHead || (canProcess(u, r) && ['new', 'work'].includes(r.status)))); if (asHead) r.approvals.push({ by: u.id, step: 'Руководитель', dec: 'rejected', comment: v, t: Date.now() }); setStatus(r, 'rejected', v); toast('Заявка отклонена'); });
  },
  take(id) { act(() => { const u = me(), r = req(id); need(r && canProcess(u, r) && r.status === 'new'); const old = r.assignee; r.assignee = u.id; audit('Назначение исполнителя', r.id, old ? user(old).fio : '', u.fio); setStatus(r, 'work'); toast('Заявка в работе', 'ok'); }); },
  async assign(id) {
    const u = me(), r = req(id); if (!r || !canProcess(u, r)) return toast('403: нет прав', 'err');
    const staff = db.users.filter(x => x.active && has(x, 'manager') && x.mdept === deptOf(r));
    const v = await ask({ title: 'Назначить исполнителя', label: 'Сотрудник отдела ' + deptName(deptOf(r)), options: staff.map(x => [x.id, x.fio + (x.id === r.assignee ? ' (текущий)' : '')]), ok: 'Назначить' });
    if (!v) return;
    act(() => { need(canProcess(me(), r)); const old = r.assignee; r.assignee = v; audit('Назначение исполнителя', r.id, old ? user(old).fio : '', user(v).fio); notify([v], 'Вам назначена заявка ' + r.num + ': ' + r.subject, r.id); if (r.status === 'new') setStatus(r, 'work', 'Назначен: ' + user(v).fio); else r.updated = Date.now(); toast('Исполнитель: ' + user(v).fio, 'ok'); });
  },
  async waiting(id) {
    const v = await ask({ title: 'Запросить информацию у автора', text: 'Таймер SLA встанет на паузу, пока автор не ответит.', label: 'Вопрос автору', req: true, ok: 'Отправить вопрос' });

    act(() => { const u = me(), r = req(id); need(r && canProcess(u, r) && r.status === 'work'); r.comments.push({ id: uid(), user: u.id, text: v, t: Date.now(), internal: false, files: [] }); setStatus(r, 'waiting', v); });
  },
  resume(id) { act(() => { const u = me(), r = req(id); need(r && canProcess(u, r) && r.status === 'waiting'); setStatus(r, 'work'); }); },
  async done(id) {
    const v = await ask({ title: 'Заявка выполнена', text: 'Автор получит просьбу оценить работу. Результат (например, справку) можно приложить в переписке.', label: 'Комментарий для автора (необязательно)', ok: 'Выполнена', cls: 'ok', em: 'happy' });
    if (v == null) return;
    act(() => { const u = me(), r = req(id); need(r && canProcess(u, r) && ['work', 'waiting'].includes(r.status)); if (!r.assignee) r.assignee = u.id; if (v) r.comments.push({ id: uid(), user: u.id, text: v, t: Date.now(), internal: false, files: [] }); setStatus(r, 'done', v); toast('Отлично! Заявка выполнена', 'ok'); });
  },
  async cancel(id) {
    const v = await ask({ title: 'Отменить заявку?', text: 'Отменить можно, пока заявку не взяли в работу.', label: 'Причина (необязательно)', ok: 'Отменить заявку', cls: 'danger', em: 'sad' });
    if (v == null) return;
    act(() => { const u = me(), r = req(id); need(r && r.author === u.id && ['new', 'approval'].includes(r.status) && !r.assignee); setStatus(r, 'cancelled', v); notify(r.status === 'approval' ? [u.manager] : managersOf(deptOf(r)), 'Заявка ' + r.num + ' отменена автором', r.id); toast('Заявка отменена'); });
  },
  async reopen(id) {
    const v = await ask({ title: 'Вернуть заявку в работу', text: 'Что осталось не так?', label: 'Комментарий', req: true, ok: 'Вернуть в работу', em: 'sad' });
    if (v == null) return;
    act(() => { const u = me(), r = req(id); need(r && r.author === u.id && r.status === 'done' && Date.now() - r.doneAt <= 3 * D); r.comments.push({ id: uid(), user: u.id, text: v, t: Date.now(), internal: false, files: [] }); setStatus(r, 'work', v); notify([r.assignee], 'Автор вернул заявку ' + r.num + ' в работу', r.id); });

  rate(e, id) {
    e.preventDefault(); const fd = new FormData(e.target), n = +fd.get('rate');
    if (!n) { toast('Выберите оценку от 1 до 5 звёзд', 'err'); return false; }
    act(() => { const u = me(), r = req(id); need(r && r.author === u.id && r.status === 'done'); r.rating = n; r.review = String(fd.get('review') || '').trim(); audit('Оценка', r.id, '', n + '★'); setStatus(r, 'closed', 'Оценка: ' + n + '★'); notify([r.assignee], 'Заявка ' + r.num + ' оценена на ' + n + '★', r.id); if (n >= 4) confetti(); toast('Спасибо за оценку!', 'ok'); });

  comment(e, id) {

    if (!text && !files.length) { toast('Напишите сообщение', 'err'); return false; }

    act(() => {
      const u = me(), r = req(id); need(r && (r.author === u.id || canProcess(u, r) || isHeadOf(u, r)));
      const internal = !!fd.get('internal') && canProcess(u, r);
      r.comments.push({ id: uid(), user: u.id, text, t: Date.now(), internal, files }); r.updated = Date.now();

      if (r.author === u.id && r.status === 'waiting') setStatus(r, 'work', 'Автор ответил');
